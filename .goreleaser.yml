version: 2

builds:
  - binary: pingolin
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

# Raw binaries named pingolin-{os}-{arch}: the README's curl commands point
# at these names under releases/latest/download, so keep them stable.
archives:
  - id: binaries
    formats:
      - binary
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

sboms:
  - artifacts: binary
    disable: false

# The release workflow attests dist/checksums.txt; keep the name stable
# instead of goreleaser's default {project}_{version}_checksums.txt.
checksum:
  name_template: "checksums.txt"

release:
  header: "{{ .Env.RELEASE_NOTES }}"

changelog:
  disable: true
