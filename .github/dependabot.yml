version: 2

# Grouped so each ecosystem opens at most one version-update PR a week.
# Security updates are not grouped and arrive as soon as an advisory lands.
# The cooldown skips releases younger than a week, which is when poisoned
# packages are usually caught and yanked.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
    ignore:
      # pflag 1.1.0 renders every bool flag in --help as
      # "--verbose[=true|false]". Held at 1.0.9 until that's fixed upstream;
      # bump by hand and check `pingolin --help` when it is.
      - dependency-name: "github.com/spf13/pflag"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
